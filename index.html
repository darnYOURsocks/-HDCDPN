                    row[header.trim()] = values[idx]?.trim().replace(/"/g, '');
                });
                
                row.Lambda = parseFloat(row.Lambda) || 0.5;
                row.Delta = parseFloat(row.Delta) || 0.1;
                row.Psi = parseFloat(row.Psi) || 0.6;
                
                data.push(row);
            }
            
            return data;
        }

        const patterns = parseCSV(patternData);
        
        // Ultra HD Canvas setup with maximum DPI scaling
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { 
            alpha: false,
            desynchronized: true
        });
        const overlay = document.getElementById('overlay');
        const panelContent = document.getElementById('panel-content');
        const tooltip = document.getElementById('tooltip');
        
        const dpr = Math.min(window.devicePixelRatio || 1, 3); // Cap at 3x for performance
        
        function resizeCanvas() {
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            ctx.scale(dpr, dpr);
        }
        
        resizeCanvas();
        
        let time = 0;
        let animationId;
        let barPositions = [];
        let hoveredBar = null;
        let particles = [];
        
        // Particle system for ambient effect
        class Particle {
            constructor() {
                this.reset();
            }
            
            reset() {
                this.x = Math.random() * window.innerWidth;
                this.y = Math.random() * window.innerHeight;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.life = Math.random();
                this.maxLife = 0.8 + Math.random() * 0.2;
                this.size = 1 + Math.random() * 2;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.003;
                
                if (this.life <= 0 || this.x < 0 || this.x > window.innerWidth || 
                    this.y < 0 || this.y > window.innerHeight) {
                    this.reset();
                }
            }
            
            draw(ctx) {
                const alpha = this.life * 0.3;
                ctx.fillStyle = `rgba(100, 150, 255, ${alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // Initialize particles
        for (let i = 0; i < 50; i++) {
            particles.push(new Particle());
        }
        
        window.addEventListener('resize', resizeCanvas);
        
        // Find related patterns based on similarity
        function findRelatedPatterns(pattern, limit = 6) {
            return patterns
                .filter(p => p.Node_ID !== pattern.Node_ID)
                .map(p => {
                    const psiDiff = Math.abs(p.Psi - pattern.Psi);
                    const lambdaDiff = Math.abs(p.Lambda - pattern.Lambda);
                    const deltaDiff = Math.abs(p.Delta - pattern.Delta);
                    const similarity = 1 - (psiDiff * 0.5 + lambdaDiff * 0.3 + deltaDiff * 0.2);
                    
                    const domainMatch = p.Domain.split('→').some(d => 
                        pattern.Domain.split('→').includes(d)
                    );
                    
                    return {
                        pattern: p,
                        similarity: similarity + (domainMatch ? 0.2 : 0),
                        reason: domainMatch ? 'Shared Domain' : 'Parameter Resonance'
                    };
                })
                .sort((a, b) => b.similarity - a.similarity)
                .slice(0, limit);
        }
        
        // Show pattern details panel
        function showPatternDetails(pattern) {
            const relatedPatterns = findRelatedPatterns(pattern);
            const tags = pattern.Tags.split(',').map(t => t.trim());
            
            panelContent.innerHTML = `
                <div class="header">
                    <h2>${pattern.Title}</h2>
                    <div class="domain">${pattern.Domain}</div>
                    <div class="core-pattern">${pattern.CorePattern}</div>
                    <div class="description">${pattern.Description}</div>
                </div>
                
                <div class="params">
                    <div class="param-box">
                        <div class="param-label">Lambda (λ)</div>
                        <div class="param-value">${pattern.Lambda}</div>
                    </div>
                    <div class="param-box">
                        <div class="param-label">Delta (δ)</div>
                        <div class="param-value">${pattern.Delta}</div>
                    </div>
                    <div class="param-box">
                        <div class="param-label">Psi (ψ)</div>
                        <div class="param-value">${pattern.Psi}</div>
                    </div>
                </div>
                
                <div class="section">
                    <div class="section-title">Cross-Domain Connections</div>
                    <div class="related-patterns">
                        ${relatedPatterns.map(r => `
                            <div class="pattern-card" onclick="showPatternDetails(patterns.find(p => p.Node_ID === '${r.pattern.Node_ID}'))">
                                <h4>${r.pattern.Title}</h4>
                                <div class="card-domain">${r.pattern.Domain}</div>
                                <div class="card-params">λ:${r.pattern.Lambda} δ:${r.pattern.Delta} ψ:${r.pattern.Psi}</div>
                                <div class="similarity-badge">${(r.similarity * 100).toFixed(0)}% ${r.reason}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                
                <div class="section">
                    <div class="section-title">Pattern Attributes</div>
                    <div class="tags">
                        ${tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                    </div>
                    
                    <div class="metadata">
                        <div class="metadata-item">
                            <span class="metadata-label">Node ID:</span>${pattern.Node_ID}
                        </div>
                        <div class="metadata-item">
                            <span class="metadata-label">Source:</span>${pattern.Source}
                        </div>
                        <div class="metadata-item">
                            <span class="metadata-label">Timestamp:</span>${pattern.Timestamp}
                        </div>
                    </div>
                </div>
            `;
            
            overlay.style.display = 'flex';
        }
        
        function closePanel() {
            overlay.style.display = 'none';
        }
        
        // Ultra HD Animation loop
        function animate() {
            time += 0.01;
            
            const w = window.innerWidth;
            const h = window.innerHeight;
            
            // Gradient background
            const bgGradient = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, Math.max(w, h));
            bgGradient.addColorStop(0, '#0f1420');
            bgGradient.addColorStop(0.5, '#0a0e1a');
            bgGradient.addColorStop(1, '#050810');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, w, h);
            
            // Draw and update particles
            particles.forEach(p => {
                p.update();
                p.draw(ctx);
            });
            
            const numLines = Math.min(patterns.length, Math.floor(w / 12));
            const lineSpacing = w / numLines;
            
            barPositions = [];
            
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            
            // Draw patterns with ultra HD quality
            for (let i = 0; i < numLines; i++) {
                const pattern = patterns[i % patterns.length];
                const x = i * lineSpacing + lineSpacing / 2;
                
                const baseHeight = h * 0.7;
                const heightModulation = Math.sin(time + i * 0.25) * 0.18 + 1;
                const height = baseHeight * pattern.Lambda * heightModulation;
                
                const baseWidth = 4 + pattern.Delta * 45;
                const widthPulse = Math.sin(time * 2.5 + i * 0.35) * 0.08 + 1;
                const width = baseWidth * widthPulse;
                
                const segments = Math.floor(10 + pattern.Psi * 18);
                const segmentHeight = height / segments;
                
                barPositions.push({
                    x: x - width / 2,
                    y: h / 2 - height / 2,
                    width: width,
                    height: height,
                    pattern: pattern
                });
                
                // Enhanced glow for hovered bar
                if (hoveredBar && hoveredBar.pattern.Node_ID === pattern.Node_ID) {
                    ctx.shadowBlur = 50;
                    ctx.shadowColor = `hsla(${(pattern.Psi * 360) % 360}, 90%, 65%, 0.9)`;
                    
                    // Outer glow ring
                    ctx.strokeStyle = `hsla(${(pattern.Psi * 360) % 360}, 80%, 60%, 0.4)`;
                    ctx.lineWidth = 6;
                    ctx.strokeRect(x - width/2 - 3, h/2 - height/2 - 3, width + 6, height + 6);
                } else {
                    ctx.shadowBlur = 0;
                }
                
                for (let s = 0; s < segments; s++) {
                    const segmentY = h / 2 - height / 2 + s * segmentHeight;
                    
                    const hue = (pattern.Psi * 360 + time * 25) % 360;
                    const saturation = 80 + pattern.Delta * 20;
                    const lightness = 48 + Math.sin(time * 1.5 + s * 0.6) * 10;
                    
                    const alpha = (s % 2 === 0) ? 0.95 : 0.55;
                    
                    // Multi-layer gradient for depth
                    const gradient = ctx.createLinearGradient(x - width/2, segmentY, x + width/2, segmentY + segmentHeight);
                    gradient.addColorStop(0, `hsla(${hue}, ${saturation}%, ${lightness - 12}%, ${alpha})`);
                    gradient.addColorStop(0.15, `hsla(${hue}, ${saturation}%, ${lightness - 5}%, ${alpha})`);
                    gradient.addColorStop(0.5, `hsla(${hue}, ${saturation}%, ${lightness}%, ${alpha})`);
                    gradient.addColorStop(0.85, `hsla(${hue}, ${saturation}%, ${lightness - 5}%, ${alpha})`);
                    gradient.addColorStop(1, `hsla(${hue}, ${saturation}%, ${lightness - 12}%, ${alpha})`);
                    
                    ctx.fillStyle = gradient;
                    
                    const segmentYOffset = Math.sin(time * 3.5 + i * 0.25 + s * 0.45) * 5;
                    const radius = Math.min(width / 3.5, 4);
                    const sx = x - width / 2;
                    const sy = segmentY + segmentYOffset;
                    const sh = segmentHeight * 0.9;
                    
                    // Rounded rectangles
                    ctx.beginPath();
                    ctx.roundRect(sx, sy, width, sh, radius);
                    ctx.fill();
                    
                    // Highlight edge
                    if (s % 2 === 0) {
                        ctx.strokeStyle = `hsla(${hue}, ${saturation}%, ${lightness + 15}%, 0.3)`;
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                }
                
                ctx.shadowBlur = 0;
                
                // Enhanced vertical line with gradient
                const lineGradient = ctx.createLinearGradient(x, h/2 - height/2, x, h/2 + height/2);
                lineGradient.addColorStop(0, `hsla(${(pattern.Psi * 360) % 360}, 70%, 40%, 0.05)`);
                lineGradient.addColorStop(0.3, `hsla(${(pattern.Psi * 360) % 360}, 70%, 45%, 0.5)`);
                lineGradient.addColorStop(0.7, `hsla(${(pattern.Psi * 360) % 360}, 70%, 45%, 0.5)`);
                lineGradient.addColorStop(1, `hsla(${(pattern.Psi * 360) % 360}, 70%, 40%, 0.05)`);
                
                ctx.strokeStyle = lineGradient;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(x, h/2 - height/2);
                ctx.lineTo(x, h/2 + height/2);
                ctx.stroke();
                
                // Ultra HD connection waves
                if (i < numLines - 1) {
                    const nextPattern = patterns[(i + 1) % patterns.length];
                    const similarity = Math.abs(pattern.Psi - nextPattern.Psi);
                    
                    if (similarity < 0.15) {
                        const wave = Math.sin(time * 2.2 - i * 0.35) * 30;
                        const waveGradient = ctx.createLinearGradient(x, h/2, x + lineSpacing, h/2);
                        waveGradient.addColorStop(0, `hsla(${(pattern.Psi * 360) % 360}, 80%, 60%, 0.12)`);
                        waveGradient.addColorStop(0.3, `hsla(${(pattern.Psi * 360) % 360}, 85%, 68%, 0.35)`);
                        waveGradient.addColorStop(0.7, `hsla(${(nextPattern.Psi * 360) % 360}, 85%, 68%, 0.35)`);
                        waveGradient.addColorStop(1, `hsla(${(nextPattern.Psi * 360) % 360}, 80%, 60%, 0.12)`);
                        
                        ctx.strokeStyle = waveGradient;
                        ctx.lineWidth = 2.5;
                        ctx.shadowBlur = 15;
                        ctx.shadowColor = `hsla(${(pattern.Psi * 360) % 360}, 80%, 60%, 0.3)`;
                        ctx.beginPath();
                        ctx.moveTo(x, h/2 + wave);
                        ctx.bezierCurveTo(
                            x + lineSpacing / 3, h/2 + wave * 1.6,
                            x + lineSpacing * 2/3, h/2 - wave * 1.6,
                            x + lineSpacing, h/2 - wave
                        );
                        ctx.stroke();
                        ctx.shadowBlur = 0;
                    }
                }
            }
            
            // Ultra HD Title with multiple shadows
            ctx.shadowBlur = 20;
            ctx.shadowColor = 'rgba(102, 170, 255, 0.7)';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.98)';
            ctx.font = 'bold 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
            ctx.fillText('Cross-Domain Pattern Network', 40, 60);
            
            ctx.shadowBlur = 12;
            ctx.shadowColor = 'rgba(102, 170, 255, 0.5)';
            ctx.font = '18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.fillText(`${patterns.length} Pattern Nodes • Click any bar to explore connections`, 40, 88);
            
            ctx.shadowBlur = 0;
            
            // Enhanced legend
            ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
            ctx.font = '14px "SF Mono", "Monaco", "Courier New", monospace';
            ctx.fillText('Height: λ (Pattern Strength)', 40, h - 78);
            ctx.fillText('Width: δ (Variation)', 40, h - 54);
            ctx.fillText('Color: ψ (Resonance)', 40, h - 30);
            
            ctx.fillStyle = 'rgba(102, 170, 255, 0.4)';
            ctx.font = '12px monospace';
            ctx.fillText(`Ultra HD • ${dpr}x DPI • ${Math.round(1000/16)}fps`, w - 220, h - 30);
            
            animationId = requestAnimationFrame(animate);
        }
        
        // Click handler
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;
            
            for (let bar of barPositions) {
                if (clickX >= bar.x && clickX <= bar.x + bar.width &&
                    clickY >= bar.y && clickY <= bar.y + bar.height) {
                    showPatternDetails(bar.pattern);
                    return;
                }
            }
        });
        
        // Enhanced hover with smooth tooltip
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            let newHoveredBar = null;
            for (let bar of barPositions) {
                if (mouseX >= bar.x && mouseX <= bar.x + bar.width &&
                    mouseY >= bar.y && mouseY <= bar.y + bar.height) {
                    newHoveredBar = bar;
                    break;
                }
            }
            
            hoveredBar = newHoveredBar;
            canvas.style.cursor = hoveredBar ? 'pointer' : 'default';
            
            if (hoveredBar) {
                tooltip.innerHTML = `<strong>${hoveredBar.pattern.Title}</strong><br><span style="color: #8bf;">${hoveredBar.pattern.Domain}</span>`;
                tooltip.style.left = (e.clientX + 20) + 'px';
                tooltip.style.top = (e.clientY + 20) + 'px';
                tooltip.classList.add('show');
            } else {
                tooltip.classList.remove('show');
            }
        });
        
        canvas.addEventListener('mouseleave', () => {
            hoveredBar = null;
            tooltip.classList.remove('show');
        });
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closePanel();
            }
        });
        
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) {
                closePanel();
            }
        });
        
        animate();
        
        window.addEventListener('beforeunload', () => {
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
        });
    </script>
</body>
</html>
